<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Open in Obsidian</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f0d;
    --fg: #efe9da;
    --muted: #9a9585;
    --accent: #6ee7a8;
    --accent-dim: #2f6b4c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .mark {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 20px;
    opacity: 0.8;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
    color: var(--fg);
  }
  .filename {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    color: var(--muted);
    word-break: break-word;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  a.button {
    display: inline-block;
    width: 100%;
    padding: 16px 20px;
    background: var(--accent);
    color: #06110a;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 12px;
    border: 1px solid var(--accent-dim);
  }
  a.button:active { opacity: 0.85; }
  .hint {
    margin-top: 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .bad {
    color: var(--fg);
  }
  .bad h1 { color: #e08a8a; }
</style>
</head>
<body>
  <main id="app">
    <div class="mark">Intrinsic Labs</div>
    <h1>Loading…</h1>
  </main>

  <noscript>
    <main>
      <div class="mark">Intrinsic Labs</div>
      <h1>Open in Obsidian</h1>
      <p class="hint">JavaScript is required to build the link. If you know the vault-relative path, open it directly in Obsidian.</p>
    </main>
  </noscript>

<script>
(function () {
  "use strict";

  var ALLOWED_VAULTS = ["intrinsic-labs-v01"];
  var DEFAULT_VAULT = "intrinsic-labs-v01";

  // Reasonable charset for a vault-relative path: unicode letters/numbers, spaces, and
  // the handful of punctuation marks that show up in real note titles and folder names.
  // No scheme, no leading slash, no "..", no control characters.
  var PATH_RE = /^[\p{L}\p{N} _\-./()'&,!]+$/u;

  function isValidPath(f) {
    if (typeof f !== "string" || f.length === 0) return false;
    if (f.length > 500) return false;
    if (f.indexOf("..") !== -1) return false;
    if (f.charAt(0) === "/") return false;
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(f)) return false; // any "scheme:" prefix
    if (/[\x00-\x1f\x7f]/.test(f)) return false; // control characters
    try {
      return PATH_RE.test(f);
    } catch (e) {
      // \p{L}/\p{N} unicode property escapes need the "u" flag support this old a browser
      // might lack — fall back to a plain ASCII-safe check rather than crash.
      return /^[A-Za-z0-9 _\-./()'&,!]+$/.test(f);
    }
  }

  function isValidVault(v) {
    return ALLOWED_VAULTS.indexOf(v) !== -1;
  }

  function obsidianUri(vaultName, filePath) {
    return "obsidian://open?vault=" + encodeURIComponent(vaultName) + "&file=" + encodeURIComponent(filePath);
  }

  function renderBad(message) {
    var app = document.getElementById("app");
    app.className = "bad";
    app.innerHTML =
      '<div class="mark">Intrinsic Labs</div>' +
      "<h1>Bad link</h1>" +
      '<p class="filename">' + message + "</p>";
  }

  function renderOpen(uri, filePath) {
    var app = document.getElementById("app");
    var safeName = document.createTextNode(filePath).textContent; // plain text, no HTML
    app.innerHTML =
      '<div class="mark">Intrinsic Labs</div>' +
      "<h1>Open in Obsidian</h1>" +
      '<p class="filename"></p>' +
      '<a class="button" href="' + uri.replace(/"/g, "&quot;") + '">Open in Obsidian</a>' +
      '<p class="hint">Tap the button if it doesn’t open automatically.</p>';
    app.querySelector(".filename").textContent = safeName;
  }

  var params = new URLSearchParams(window.location.search);
  var f = params.get("f");
  var vRaw = params.get("v");

  if (!isValidPath(f)) {
    renderBad("No valid file path was given.");
    return;
  }

  var vault = DEFAULT_VAULT;
  if (vRaw !== null) {
    if (!isValidVault(vRaw)) {
      renderBad("Unrecognized vault.");
      return;
    }
    vault = vRaw;
  }

  var uri = obsidianUri(vault, f);
  renderOpen(uri, f);

  // Best-effort automatic jump — the button above is the fallback a user gesture always
  // has, since some browsers refuse a script-initiated custom-scheme navigation.
  window.location.href = uri;
})();
</script>
</body>
</html>
